<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<base target="_top">
<title>{{PAGE_TITLE}} · {{WARD_NAME}}</title>
<meta property="og:title" content="{{WARD_NAME}} · {{PAGE_TITLE}}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{PREVIEW_IMAGE}}">
<!-- GP:CSS -->
</head>
<body>
<main class="gp-wrap gp-wide">
  <header class="gp-head">
    <p class="gp-ward">{{WARD_NAME}}</p>
    <h1>{{PAGE_TITLE}}</h1>
  </header>
  <div id="gp-main"><p class="gp-loading">Loading…</p></div>
</main>
<footer class="gp-footer" id="gp-footer">
  <p>This page is an independent tool made by Church members. It is not an official product of, or sponsored by, The Church of Jesus Christ of Latter-day Saints.</p>
  <p class="gp-contact">Contact: <a href="mailto:{{CONTACT_EMAIL}}">{{CONTACT_EMAIL}}</a></p>
</footer>
<!-- GP:JS -->
<script>
GP.init({ page: 'leader', wardName: {{WARD_NAME}}, webAppUrl: {{WEB_APP_URL}}, contact: {{CONTACT_EMAIL}}, fallback: {{FALLBACK}} });
GP.footer();
(function () {
  var el = GP.el;
  var main = GP.$('gp-main');
  var STATUS_LABEL = { 'Waiting-email': 'Waiting for their email click', 'Waiting-approval': 'Waiting for approval' };
  var WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var K = '';
  var me = null;
  var state = { tab: 'list', past: false, form: null, errors: {}, formError: '', flash: null };

  // ---------- helpers ----------

  function call(action, data) {
    data = data || {};
    data.k = K;
    return GP.call(action, data).then(function (res) {
      if (res && res.relink) {
        showRequest(res.error);
        throw { handled: true };
      }
      return res;
    });
  }

  function failed(err, box) {
    if (err && err.handled) return;
    GP.show(box || main, GP.unreachable('leader'));
  }

  function flash(kind, text) {
    state.flash = { kind: kind, text: text };
  }

  function uniq(list) {
    var out = [];
    list.forEach(function (x) {
      if (out.indexOf(x) < 0) out.push(x);
    });
    return out;
  }

  function blankRole() {
    return { slotId: '', start: '', end: '', role: '', needed: 1, roleNote: '', bringingPrompt: '' };
  }

  function copyRole(r) {
    return { slotId: '', start: r.start, end: r.end, role: r.role, needed: r.needed, roleNote: r.roleNote, bringingPrompt: r.bringingPrompt };
  }

  /**
   * Organizations this form may use: with no category the leader's own; in a category, the ones
   * its rule gives this leader (whoami catOrgs). An edit that keeps the category keeps the post's
   * organization too.
   */
  function orgsFor(f) {
    var list = f.category ? (me.access.catOrgs && me.access.catOrgs[f.category]) || [] : me.access.baseCreateOrgs;
    if (f.postId && f.category === f.origCategory && f.origOrganization) list = list.concat([f.origOrganization]);
    return uniq(list);
  }

  function categoryById(id) {
    for (var i = 0; i < me.categories.length; i++) if (me.categories[i].id === id) return me.categories[i];
    return null;
  }

  function newForm() {
    // A coordinator with no organization of their own starts in their first category.
    var cat = me.access.baseCreateOrgs.length ? '' : me.categories[0] ? me.categories[0].id : '';
    var f = {
      postId: '',
      status: '',
      organization: '',
      category: cat,
      title: '',
      audiences: [],
      publicNote: '',
      privateDetails: '',
      cutoffHours: '',
      dates: [{ date: '', roles: [blankRole()] }],
    };
    f.organization = orgsFor(f)[0] || '';
    var c = categoryById(cat);
    if (c && c.audiences) f.audiences = c.audiences.slice();
    return f;
  }

  /** Server post → form model (slots grouped by date). */
  function toForm(post) {
    var dates = [];
    var at = {};
    post.slots.forEach(function (s) {
      if (!(s.date in at)) {
        at[s.date] = dates.length;
        dates.push({ date: s.date, roles: [] });
      }
      dates[at[s.date]].roles.push({
        slotId: s.slotId,
        start: s.start || '',
        end: s.end || '',
        role: s.role,
        needed: s.needed,
        roleNote: s.roleNote || '',
        bringingPrompt: s.bringingPrompt || '',
        filled: s.filled || 0,
      });
    });
    return {
      postId: post.postId,
      status: post.status,
      fromRequest: !!post.fromRequest,
      origCategory: post.category || '',
      origOrganization: post.organization,
      organization: post.organization,
      category: post.category || '',
      title: post.title,
      audiences: post.audiences.slice(),
      publicNote: post.publicNote || '',
      privateDetails: post.privateDetails || '',
      cutoffHours: post.cutoffHours === '' || post.cutoffHours === null || post.cutoffHours === undefined ? '' : String(post.cutoffHours),
      dates: dates.length ? dates : [{ date: '', roles: [blankRole()] }],
    };
  }

  /** Form model → [slots], plus where each slot index sits ([dateIndex, roleIndex]). */
  function flatten(form) {
    var slots = [];
    var where = [];
    form.dates.forEach(function (d, di) {
      d.roles.forEach(function (r, ri) {
        slots.push({
          slotId: r.slotId,
          date: d.date,
          start: r.start,
          end: r.end,
          role: r.role,
          needed: r.needed,
          roleNote: r.roleNote,
          bringingPrompt: r.bringingPrompt,
        });
        where.push([di, ri]);
      });
    });
    return { slots: slots, where: where };
  }

  function slotErrorKey(form, di, ri, field) {
    var map = flatten(form).where;
    for (var i = 0; i < map.length; i++) if (map[i][0] === di && map[i][1] === ri) return 'slots[' + i + '].' + field;
    return '';
  }

  function err(key) {
    var msg = state.errors[key];
    return msg ? el('p', { class: 'gp-error', role: 'alert' }, msg) : null;
  }

  function field(label, input, key) {
    return el('div', {}, [el('label', { for: input.id }, label), input, err(key)]);
  }

  var uid = 0;
  function nextId(prefix) {
    uid += 1;
    return prefix + uid;
  }

  // ---------- request a link ----------

  function showRequest(error) {
    var email = el('input', { type: 'email', id: 'gp-req-email', autocomplete: 'email', maxlength: '254' });
    var out = el('div');
    var button = el('button', { type: 'submit' }, 'Email me a leader link');
    var form = el(
      'form',
      {
        onsubmit: function (e) {
          e.preventDefault();
          button.disabled = true;
          GP.call('requestLeaderLink', { email: email.value }).then(
            function (res) {
              button.disabled = false;
              GP.show(out, GP.message(res && res.ok ? 'ok' : 'alert', res && res.ok ? res.message : GP.errorText(res)));
            },
            function () {
              button.disabled = false;
              GP.show(out, GP.unreachable('leader'));
            }
          );
        },
      },
      [el('label', { for: 'gp-req-email' }, 'Your email, as it is on the ward leader list'), email, el('p', {}, [button])]
    );
    GP.show(main, [
      error ? GP.message('alert', error) : null,
      el('p', {}, 'Leaders open this page with a personal link sent by email. Type your email and we will send you one.'),
      form,
      out,
    ]);
  }

  // ---------- the signed-in page ----------

  function tab(name, label, before) {
    return el('button', {
      type: 'button',
      role: 'tab',
      'aria-selected': String(state.tab === name),
      onclick: function () {
        if (before) before();
        state.tab = name;
        render();
      },
    }, label);
  }

  function render() {
    var a = me.access;
    var tabs = el('div', { class: 'gp-tabs', role: 'tablist' }, [
      tab('list', 'My opportunities'),
      a.canApprove ? tab('waiting', 'Waiting for approval') : null,
      a.isCouncil ? tab('needs', 'Needs help soon') : null,
      tab('form', state.form && state.form.postId ? 'Edit opportunity' : 'New opportunity', function () {
        if (!state.form) state.form = newForm();
        state.errors = {};
        state.formError = '';
      }),
      a.isBishopric ? tab('volunteers', 'Volunteers') : null,
    ]);
    var signOut = el('button', {
      type: 'button',
      class: 'gp-light',
      onclick: function () {
        if (!window.confirm('Sign out everywhere? Your current link stops working and we email you a new one.')) return;
        call('signOutEverywhere').then(function (res) {
          GP.show(main, GP.message(res.ok ? 'ok' : 'alert', res.ok ? res.message : GP.errorText(res)));
        }, failed);
      },
    }, 'Sign out everywhere');
    var who = el('div', { class: 'gp-card' }, [
      el('p', { style: 'margin:0' }, 'Signed in as ' + me.leader.name + (me.leader.organization ? ', ' + me.leader.organization : '')),
      signOut,
    ]);
    var body = el('div');
    var note = state.flash ? GP.message(state.flash.kind, state.flash.text) : null;
    state.flash = null;
    GP.show(main, [who, tabs, note, body]);
    if (state.tab === 'waiting') renderWaiting(body);
    else if (state.tab === 'needs') renderNeeds(body);
    else if (state.tab === 'volunteers') renderVolunteers(body);
    else if (state.tab === 'form') renderForm(body);
    else renderList(body);
  }

  /** Runs a leader action, then shows its answer above the current tab. */
  function act(action, data, box, btn) {
    if (btn) btn.disabled = true;
    call(action, data).then(function (res) {
      flash(res.ok ? 'ok' : 'alert', res.ok ? res.message : GP.errorText(res));
      render();
    }, function (e) {
      if (btn) btn.disabled = false;
      failed(e, box);
    });
  }

  // ---------- Waiting for approval ----------

  function renderWaiting(body) {
    GP.show(body, el('p', { class: 'gp-loading' }, 'Loading…'));
    call('waiting').then(function (res) {
      if (!res.ok) return GP.show(body, GP.message('alert', GP.errorText(res)));
      var parts = [
        el('p', { class: 'gp-meta' }, 'People who confirmed their email and wait for a leader. Check the ward directory, then approve or decline. Approval counts for the whole ward; you and the time are recorded.'),
      ];
      if (!res.volunteers.length) parts.push(el('p', { class: 'gp-muted' }, 'Nobody is waiting for you.'));
      res.volunteers.forEach(function (v) {
        var out = el('div');
        var approve = el('button', { type: 'button', onclick: function () { act('decide', { email: v.email, decision: 'approve' }, out, approve); } }, 'Approve');
        var decline = el('button', {
          type: 'button',
          class: 'gp-danger',
          onclick: function () {
            if (!window.confirm('Decline ' + v.name + '? Their waiting sign-ups end, and they are asked to contact the ward. The bishopric can undo this.')) return;
            act('decide', { email: v.email, decision: 'decline' }, out, decline);
          },
        }, 'Decline');
        parts.push(el('div', { class: 'gp-card' }, [
          el('h3', {}, v.name),
          el('p', { class: 'gp-meta' }, v.email + ' · first signed up for ' + (v.firstPost || 'an opportunity') + (v.firstPostOrganization ? ' (' + v.firstPostOrganization + ')' : '')),
          v.signups.length
            ? el('div', {}, v.signups.map(function (s) {
                return el('div', { class: 'gp-person' }, (s.childName ? s.childName + ': ' : '') + s.title + ' · ' + GP.fmtDate(s.date) + (s.start ? ', ' + GP.fmtTime(s.start) : '') + ' · ' + s.role);
              }))
            : el('p', { class: 'gp-muted' }, 'No sign-ups waiting right now.'),
          el('p', {}, [approve, decline]),
          out,
        ]));
      });
      GP.show(body, parts);
    }, function (e) { failed(e, body); });
  }

  // ---------- Needs help soon ----------

  function renderNeeds(body) {
    GP.show(body, el('p', { class: 'gp-loading' }, 'Loading…'));
    call('needsHelp').then(function (res) {
      if (!res.ok) return GP.show(body, GP.message('alert', GP.errorText(res)));
      var parts = [el('p', { class: 'gp-meta' }, 'Open roles still short in the next 14 days, soonest first.')];
      if (!res.rows.length) parts.push(el('p', { class: 'gp-muted' }, 'Nothing is short in the next 14 days.'));
      res.rows.forEach(function (r) {
        parts.push(el('div', { class: 'gp-slot' }, [
          el('strong', {}, GP.fmtDate(r.date) + (r.start ? ', ' + GP.fmtTimes(r.start, r.end) : '') + ' · ' + r.role),
          el('span', { class: 'gp-count' }, ' ' + r.filled + ' of ' + r.needed + ' filled'),
          el('div', { class: 'gp-meta' }, [r.organization + ' · ', el('a', { href: r.publicUrl, target: '_blank', rel: 'noopener' }, r.title)]),
        ]));
      });
      GP.show(body, parts);
    }, function (e) { failed(e, body); });
  }

  // ---------- Volunteers (bishopric) ----------

  function renderVolunteers(body) {
    GP.show(body, el('p', { class: 'gp-loading' }, 'Loading…'));
    call('volunteers').then(function (res) {
      if (!res.ok) return GP.show(body, GP.message('alert', GP.errorText(res)));
      var parts = [el('p', { class: 'gp-meta' }, 'Everyone who has signed up. Undo a decline to let someone sign up again; revoke an approval when someone should no longer serve (their current sign-ups stay until you remove them).')];
      if (!res.volunteers.length) parts.push(el('p', { class: 'gp-muted' }, 'No volunteers yet.'));
      res.volunteers.forEach(function (v) {
        var out = el('div');
        var bits = [
          el('strong', {}, v.name),
          el('span', { class: 'gp-meta' }, ' ' + v.email),
          el('div', { class: 'gp-meta' }, v.status + (v.status === 'Pending' && !v.emailConfirmed ? ' (has not clicked the email yet)' : '') + (v.decidedBy ? ' · ' + v.decidedBy + ', ' + v.decidedAt : '') + (v.firstPost ? ' · first: ' + v.firstPost : '')),
        ];
        if (v.status === 'Declined' || v.status === 'Revoked') {
          var undo = el('button', { type: 'button', class: 'gp-light', onclick: function () { act('bishopric', { email: v.email, decision: 'undo' }, out, undo); } }, 'Undo ' + (v.status === 'Declined' ? 'decline' : 'revoke'));
          bits.push(undo);
        }
        if (v.status === 'Approved') {
          var revoke = el('button', {
            type: 'button',
            class: 'gp-danger',
            onclick: function () {
              if (!window.confirm('Revoke ' + v.name + '? They can no longer sign up. Their current sign-ups stay until you remove them.')) return;
              act('bishopric', { email: v.email, decision: 'revoke' }, out, revoke);
            },
          }, 'Revoke');
          bits.push(revoke);
        }
        bits.push(out);
        parts.push(el('div', { class: 'gp-person' }, bits));
      });
      GP.show(body, parts);
    }, function (e) { failed(e, body); });
  }

  // ---------- My opportunities ----------

  function renderList(body) {
    GP.show(body, el('p', { class: 'gp-loading' }, 'Loading…'));
    call('listPosts', { past: state.past }).then(function (res) {
      if (!res.ok) return GP.show(body, GP.message('alert', GP.errorText(res)));
      var parts = [];
      if (!res.posts.length) {
        parts.push(el('p', { class: 'gp-muted' }, state.past ? 'No past opportunities.' : 'No opportunities yet. Use New opportunity to make one.'));
      }
      res.posts.forEach(function (p) {
        parts.push(postCard(p));
      });
      parts.push(
        el('p', {}, [
          el('button', { type: 'button', class: 'gp-light', onclick: function () { state.past = !state.past; render(); } }, state.past ? 'Show current opportunities' : 'Show past opportunities'),
        ])
      );
      GP.show(body, parts);
    }, function (e) { failed(e, body); });
  }

  /** The inline "are you sure" panel for cancelling a post (date blank) or one date. */
  function cancelPanel(p, date, box) {
    var note = el('textarea', { id: nextId('gp-cancel-note-'), maxlength: '300', placeholder: 'Optional note for the email (up to 300 characters)' });
    var msg = el('div');
    var question = date
      ? 'Cancel ' + GP.fmtDate(date) + '? Everyone signed up for that date gets an email, and no reminders go out for it.'
      : 'Cancel this opportunity? Everyone signed up gets an email, and no reminders go out.';
    var yes = el('button', {
      type: 'button',
      class: 'gp-danger',
      onclick: function () {
        yes.disabled = true;
        call(date ? 'cancelDate' : 'cancelPost', { postId: p.postId, date: date || '', note: note.value }).then(function (res) {
          if (!res.ok) {
            yes.disabled = false;
            return GP.show(msg, GP.message('alert', GP.errorText(res)));
          }
          flash('ok', res.message);
          render();
        }, function (e) {
          yes.disabled = false;
          failed(e, msg);
        });
      },
    }, date ? 'Yes, cancel this date' : 'Yes, cancel it');
    var no = el('button', { type: 'button', class: 'gp-light', onclick: function () { GP.clear(box); } }, 'Keep it');
    GP.show(box, el('div', { class: 'gp-alert' }, [
      el('p', { style: 'margin-top:0' }, question),
      el('label', { for: note.id }, 'Note (optional)'),
      note,
      el('p', {}, [yes, no]),
      msg,
    ]));
  }

  function postCard(p) {
    var bySlot = {};
    p.signups.forEach(function (s) {
      (bySlot[s.slotId] = bySlot[s.slotId] || []).push(s);
    });
    var live = p.status !== 'Past' && p.status !== 'Cancelled';
    var out = el('div');
    var items = [
      el('h3', {}, p.title),
      el('p', { class: 'gp-meta' }, [
        p.status + ' · ' + p.organization + (p.audiences.length ? ' · ' + p.audiences.join(', ') : ''),
        p.fromRequest ? ' ' : null,
        p.fromRequest ? el('span', { class: 'gp-tag' }, 'From a request') : null,
      ]),
    ];
    if (p.status === 'Open') {
      var copyBtn = el('button', { type: 'button', class: 'gp-light', onclick: function () { GP.copyText(p.publicUrl, copyBtn); } }, 'Copy');
      items.push(el('p', { class: 'gp-meta' }, ['Public link: ', el('a', { href: p.publicUrl, target: '_blank', rel: 'noopener' }, p.publicUrl), ' ', copyBtn]));
    }
    if (p.status === 'Closed' || p.status === 'Draft') {
      items.push(el('p', { class: 'gp-meta' }, 'No one new can sign up. People already signed up keep their place and still get their reminder.'));
    }
    var dates = {};
    p.slots.forEach(function (s) {
      dates[s.date] = true;
    });
    var multiDate = Object.keys(dates).length > 1;
    var bookedDates = {};
    p.signups.forEach(function (su) {
      p.slots.forEach(function (x) {
        if (x.slotId === su.slotId) bookedDates[x.date] = true;
      });
    });
    var cancelShown = {};
    p.slots.forEach(function (s) {
      var people = (bySlot[s.slotId] || []).map(function (su) {
        return personRow(p, s, su, out);
      });
      var dateBits = [];
      // One "Cancel this date" per date with people signed up, when the post has other dates.
      if (p.canEdit && live && multiDate && bookedDates[s.date] && !cancelShown[s.date]) {
        cancelShown[s.date] = true;
        var dateBox = el('div');
        dateBits.push(el('button', { type: 'button', class: 'gp-danger', onclick: function () { cancelPanel(p, s.date, dateBox); } }, 'Cancel this date'));
        dateBits.push(dateBox);
      }
      items.push(
        el('div', { class: 'gp-slot' }, [
          el('strong', {}, GP.fmtDate(s.date) + (s.start ? ', ' + GP.fmtTimes(s.start, s.end) : '') + ' · ' + s.role),
          el('span', { class: 'gp-count' }, ' ' + s.filled + ' of ' + s.needed + (s.waiting ? ' · ' + s.waiting + ' waiting' : '') + (s.filled >= s.needed ? ' · Filled ✓' : '')),
        ].concat(people.length ? people : [el('div', { class: 'gp-person gp-muted' }, 'No one yet.')]).concat(dateBits))
      );
    });
    if (p.canEdit && live) {
      var cancelBox = el('div');
      var actions = [
        el('button', { type: 'button', onclick: function () { openForEdit(p.postId, false, out); } }, 'Edit'),
        el('button', { type: 'button', class: 'gp-light', onclick: function () { openForEdit(p.postId, true, out); } }, 'Copy this post'),
      ];
      if (p.status === 'Open' || p.status === 'Draft') {
        actions.push(
          el('button', {
            type: 'button',
            class: 'gp-light',
            onclick: function () {
              var q = 'Close "' + p.title + '"? No one new can sign up. People already signed up keep their place and still get their reminder. (If it is not happening at all, use Cancel this opportunity.)';
              if (!window.confirm(q)) return;
              call('savePost', { mode: 'close', post: { postId: p.postId } }).then(function (res) {
                flash(res.ok ? 'ok' : 'alert', res.ok ? 'Closed.' : GP.errorText(res));
                render();
              }, function (e) { failed(e, out); });
            },
          }, 'Close')
        );
      }
      actions.push(el('button', { type: 'button', class: 'gp-danger', onclick: function () { cancelPanel(p, '', cancelBox); } }, 'Cancel this opportunity'));
      items.push(el('p', {}, actions));
      items.push(cancelBox);
    } else if (p.canEdit && p.status === 'Past') {
      items.push(el('p', {}, [el('button', { type: 'button', class: 'gp-light', onclick: function () { openForEdit(p.postId, true, out); } }, 'Copy this post')]));
    }
    items.push(out);
    return el('div', { class: 'gp-card' }, items);
  }

  function personRow(p, s, su, out) {
    var bits = [el('span', {}, su.label || su.name)];
    if (STATUS_LABEL[su.status]) bits.push(el('span', { class: 'gp-tag' }, STATUS_LABEL[su.status]));
    if (su.overLimit) bits.push(el('span', { class: 'gp-tag' }, 'Over the number'));
    if (su.bringing) bits.push(el('span', { class: 'gp-meta' }, 'Bringing: ' + su.bringing));
    if (su.email) bits.push(el('span', { class: 'gp-meta' }, su.email));
    if (p.canEdit && p.status !== 'Past' && p.status !== 'Cancelled') {
      bits.push(
        el('button', {
          type: 'button',
          class: 'gp-danger',
          onclick: function () {
            if (!window.confirm('Remove ' + su.name + ' from ' + s.role + ' on ' + GP.fmtDate(s.date) + '? We will email them.')) return;
            call('removeSignup', { signupId: su.signupId }).then(function (res) {
              flash(res.ok ? 'ok' : 'alert', res.ok ? res.message : GP.errorText(res));
              render();
            }, function (e) { failed(e, out); });
          },
        }, 'Remove')
      );
    }
    return el('div', { class: 'gp-person' }, bits);
  }

  function openForEdit(postId, asCopy, out) {
    call('getPost', { postId: postId }).then(function (res) {
      if (!res.ok) return GP.show(out, GP.message('alert', GP.errorText(res)));
      var f = toForm(res.post);
      if (asCopy) {
        f.postId = '';
        f.status = '';
        f.title = ('Copy of ' + f.title).slice(0, 100);
        f.dates.forEach(function (d) {
          d.roles = d.roles.map(copyRole);
        });
        // A copy keeps its category when this leader may create in it; otherwise one must be picked.
        if (!categoryById(f.category)) f.category = '';
        if (orgsFor(f).indexOf(f.organization) < 0) f.organization = orgsFor(f)[0] || '';
      }
      state.form = f;
      state.errors = {};
      state.formError = '';
      state.tab = 'form';
      render();
    }, function (e) { failed(e, out); });
  }

  // ---------- New / edit opportunity ----------

  function bindText(input, obj, key) {
    input.addEventListener('input', function () {
      obj[key] = input.value;
    });
    return input;
  }

  function renderForm(body) {
    var f = state.form || (state.form = newForm());
    var orgs = orgsFor(f);
    if (!orgs.length) {
      return GP.show(body, GP.message('alert', "Your leader role can't create opportunities yet. Ask the bishopric to tick Org editor for you on the Leaders tab, or to add your email to a category's Coordinators."));
    }
    if (orgs.indexOf(f.organization) < 0) f.organization = orgs[0];

    var org = el('select', { id: 'gp-org', onchange: function () { f.organization = org.value; } }, orgs.map(function (o) {
      return el('option', { value: o, selected: o === f.organization ? 'selected' : null }, o);
    }));
    org.value = f.organization;
    // A new post (and a copy) needs a category; an old post saved without one may stay that way.
    var blankLabel = f.postId ? '(none)' : 'Pick a category';
    var catChoices = (f.category ? [] : [el('option', { value: '' }, blankLabel)]).concat(
      me.categories.map(function (c) {
        return el('option', { value: c.id }, (c.icon ? c.icon + ' ' : '') + c.name);
      })
    );
    if (f.category && !categoryById(f.category)) catChoices.push(el('option', { value: f.category }, f.category));
    var cat = el('select', {
      id: 'gp-cat',
      onchange: function () {
        f.category = cat.value;
        var c = categoryById(f.category);
        if (c && c.audiences && c.audiences.length && !f.audiences.length) f.audiences = c.audiences.slice();
        render();
      },
    }, catChoices);
    cat.value = f.category;
    var childNote = el('p', { class: 'gp-meta' + (f.audiences.indexOf('Youth') >= 0 || f.audiences.indexOf('Children') >= 0 ? '' : ' gp-hidden') },
      'Who is serving: the sign-up form asks "Me / My child" and takes a child\'s first name. Every email goes to the parent; you see "Ana (signed up by …)".');
    var title = bindText(el('input', { type: 'text', id: 'gp-title-in', maxlength: '100', value: f.title }), f, 'title');
    var audiences = el('div', { role: 'group', 'aria-label': 'Who is it for' }, GP.AUDIENCES.map(function (a) {
      var box = el('input', {
        type: 'checkbox',
        checked: f.audiences.indexOf(a) >= 0,
        onchange: function () {
          f.audiences = GP.AUDIENCES.filter(function (x) {
            return x === a ? box.checked : f.audiences.indexOf(x) >= 0;
          });
          var young = f.audiences.indexOf('Youth') >= 0 || f.audiences.indexOf('Children') >= 0;
          childNote.className = 'gp-meta' + (young ? '' : ' gp-hidden');
        },
      });
      return el('label', { class: 'gp-check' }, [box, a]);
    }));
    var note = bindText(el('textarea', { id: 'gp-note', maxlength: '2000' }), f, 'publicNote');
    note.value = f.publicNote;
    var priv = bindText(el('textarea', { id: 'gp-priv', maxlength: '1000' }), f, 'privateDetails');
    priv.value = f.privateDetails;
    var cutoff = bindText(el('input', { type: 'number', id: 'gp-cutoff', min: '0', max: '168', step: '1', value: f.cutoffHours, placeholder: String(me.defaults.cutoffHours) }), f, 'cutoffHours');

    var parts = [
      el('h2', {}, f.postId ? 'Edit opportunity' : 'New opportunity'),
      f.fromRequest
        ? el('p', { class: 'gp-alert', role: 'note' }, [
            el('span', { class: 'gp-tag' }, 'From a request'),
            " Check the date and write the public note. Never put the family's name, address or situation in the public note.",
          ])
        : null,
      state.formError ? GP.message('alert', state.formError) : null,
      field('Category', cat, 'category'),
      field('Organization', org, 'organization'),
      field('Title (everyone sees this)', title, 'title'),
      el('div', {}, [el('label', {}, 'Who is it for?'), audiences, err('audiences'), childNote]),
      field('Public note (everyone sees this)', note, 'publicNote'),
      field('Private details: an address, a gate code (sent only to approved volunteers who are signed up: in their confirmation email, their reminder and My sign-ups, until the date is over)', priv, 'privateDetails'),
      field('Cancel cutoff in hours (after this, a cancellation tells you that you are short)', cutoff, 'cutoffHours'),
      el('h2', {}, 'Dates and roles'),
      err('slots'),
    ];
    f.dates.forEach(function (d, di) {
      parts.push(dateBlock(f, d, di));
    });
    parts.push(
      el('p', {}, [
        el('button', { type: 'button', class: 'gp-light', onclick: function () {
          var last = f.dates[f.dates.length - 1];
          f.dates.push({ date: '', roles: last ? last.roles.map(copyRole) : [blankRole()] });
          render();
        } }, 'Add date'),
      ])
    );
    parts.push(addDatesPanel(f));
    var actions = [];
    if (f.status === 'Open') {
      actions.push(el('button', { type: 'button', onclick: function () { save('publish'); } }, 'Save changes'));
      actions.push(el('button', { type: 'button', class: 'gp-light', onclick: function () { save('draft'); } }, 'Save as draft (hide it)'));
      parts.push(el('p', { class: 'gp-meta' }, 'Save as draft hides it from the public page. People already signed up keep their place and still get their reminder.'));
    } else if (f.status === 'Closed') {
      actions.push(el('button', { type: 'button', onclick: function () { save('publish'); } }, 'Reopen and save'));
      actions.push(el('button', { type: 'button', class: 'gp-light', onclick: function () { save('draft'); } }, 'Save as draft'));
    } else {
      actions.push(el('button', { type: 'button', class: 'gp-light', onclick: function () { save('draft'); } }, 'Save as draft'));
      actions.push(el('button', { type: 'button', onclick: function () { save('publish'); } }, 'Publish'));
    }
    actions.push(el('button', { type: 'button', class: 'gp-light', onclick: function () {
      if (!window.confirm('Leave this form? Changes you have not saved are lost.')) return;
      state.form = null;
      state.errors = {};
      state.formError = '';
      state.tab = 'list';
      render();
    } }, 'Cancel'));
    parts.push(el('p', {}, actions));
    GP.show(body, parts);
  }

  function dateBlock(f, d, di) {
    var date = el('input', { type: 'date', id: nextId('gp-date-'), value: d.date });
    date.addEventListener('input', function () {
      d.date = date.value;
    });
    var roles = d.roles.map(function (r, ri) {
      return roleBlock(f, d, di, r, ri);
    });
    return el('div', { class: 'gp-date' }, [
      el('div', {}, [el('label', { for: date.id }, 'Date'), date, err(slotErrorKey(f, di, 0, 'date'))]),
    ].concat(roles).concat([
      el('p', {}, [
        el('button', { type: 'button', class: 'gp-light', onclick: function () { d.roles.push(blankRole()); render(); } }, 'Add role'),
        el('button', { type: 'button', class: 'gp-light', onclick: function () {
          f.dates.splice(di + 1, 0, { date: '', roles: d.roles.map(copyRole) });
          render();
        } }, 'Copy this date'),
        f.dates.length > 1
          ? el('button', { type: 'button', class: 'gp-danger', onclick: function () { f.dates.splice(di, 1); render(); } }, 'Remove date')
          : null,
      ]),
    ]));
  }

  function roleBlock(f, d, di, r, ri) {
    function input(type, key, attrs) {
      var a = { type: type, id: nextId('gp-r-'), value: r[key] === undefined ? '' : String(r[key]) };
      Object.keys(attrs || {}).forEach(function (k) {
        a[k] = attrs[k];
      });
      return bindText(el('input', a), r, key);
    }
    var role = input('text', 'role', { maxlength: '60', placeholder: 'e.g. Bring a meal' });
    var needed = input('number', 'needed', { min: '1', max: '200', step: '1' });
    var start = input('time', 'start');
    var end = input('time', 'end');
    var roleNote = input('text', 'roleNote', { maxlength: '300' });
    var prompt = input('text', 'bringingPrompt', { maxlength: '100', placeholder: 'e.g. What are you bringing?' });
    var key = function (fieldName) {
      return slotErrorKey(f, di, ri, fieldName);
    };
    return el('div', { class: 'gp-role' }, [
      el('div', { class: 'gp-row' }, [field('Role', role, key('role')), field('How many people', needed, key('needed'))]),
      el('div', { class: 'gp-row' }, [field('Start (optional)', start, key('start')), field('End (optional)', end, key('end'))]),
      field('Note for this role (optional)', roleNote, key('roleNote')),
      field('Ask volunteers (optional)', prompt, key('bringingPrompt')),
      r.filled ? el('p', { class: 'gp-meta' }, r.filled + ' signed up') : null,
      d.roles.length > 1
        ? el('button', { type: 'button', class: 'gp-danger', onclick: function () { d.roles.splice(ri, 1); render(); } }, 'Remove role')
        : null,
    ]);
  }

  function addDatesPanel(f) {
    var start = el('input', { type: 'date', id: 'gp-many-start' });
    var end = el('input', { type: 'date', id: 'gp-many-end' });
    var boxes = WEEKDAYS.map(function (w, i) {
      return el('input', { type: 'checkbox', value: String(i) });
    });
    var msg = el('div');
    return el('details', { class: 'gp-card' }, [
      el('summary', {}, 'Add dates (for meal trains and other repeating needs)'),
      el('div', { class: 'gp-row' }, [field('From', start, ''), field('To', end, '')]),
      el('p', { class: 'gp-meta' }, 'On these days (none ticked means every day):'),
      el('div', { class: 'gp-row' }, boxes.map(function (b, i) {
        return el('label', { class: 'gp-check' }, [b, WEEKDAYS[i]]);
      })),
      el('p', {}, [
        el('button', { type: 'button', class: 'gp-light', onclick: function () {
          var days = boxes.filter(function (b) { return b.checked; }).map(function (b) { return Number(b.value); });
          var list = GP.expandDates(start.value, end.value, days);
          if (!list.length) return GP.show(msg, GP.message('alert', 'Pick a start and an end date (the end on or after the start).'));
          var template = f.dates[f.dates.length - 1];
          var roles = template ? template.roles : [blankRole()];
          // Fill the first empty date block before adding new ones.
          if (f.dates.length === 1 && !f.dates[0].date) f.dates = [];
          list.forEach(function (day) {
            f.dates.push({ date: day, roles: roles.map(copyRole) });
          });
          render();
        } }, 'Add these dates'),
      ]),
      msg,
    ]);
  }

  function save(action) {
    var f = state.form;
    var post = {
      postId: f.postId,
      organization: f.organization,
      category: f.category,
      title: f.title,
      audiences: f.audiences,
      publicNote: f.publicNote,
      privateDetails: f.privateDetails,
      cutoffHours: f.cutoffHours,
      slots: flatten(f).slots,
    };
    call('savePost', { mode: action, post: post }).then(function (res) {
      if (!res.ok) {
        state.errors = res.fields || {};
        state.formError = GP.errorText(res);
        render();
        window.scrollTo(0, 0);
        return;
      }
      state.form = null;
      state.errors = {};
      state.formError = '';
      state.tab = 'list';
      flash('ok', action === 'publish' ? 'Published. Share this link: ' + res.publicUrl : 'Saved as a draft. Nobody else sees it until you publish it.');
      render();
      window.scrollTo(0, 0);
    }, function (e) {
      if (e && e.handled) return;
      state.formError = "Can't reach the portal right now. What you typed is still here; try Save again in a minute.";
      render();
      window.scrollTo(0, 0);
    });
  }

  // ---------- start ----------

  GP.hash().then(function (h) {
    K = h.k || '';
    if (!K) return showRequest('');
    call('whoami').then(function (res) {
      if (!res.ok) return GP.show(main, GP.message('alert', GP.errorText(res)));
      me = res;
      render();
    }, failed);
  });
})();
</script>
</body>
</html>
