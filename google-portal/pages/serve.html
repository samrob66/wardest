<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<base target="_top">
<title>{{PAGE_TITLE}} · {{WARD_NAME}}</title>
<meta property="og:title" content="{{WARD_NAME}} · {{PAGE_TITLE}}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{PREVIEW_IMAGE}}">
<!-- GP:CSS -->
</head>
<body>
<main class="gp-wrap gp-wide">
  <header class="gp-head">
    <p class="gp-ward">{{WARD_NAME}}</p>
    <h1>{{PAGE_TITLE}}</h1>
  </header>
  <div id="gp-main"><p class="gp-loading">Loading…</p></div>
</main>
<footer class="gp-footer" id="gp-footer">
  <p>This page is an independent tool made by Church members. It is not an official product of, or sponsored by, The Church of Jesus Christ of Latter-day Saints.</p>
  <p class="gp-contact">Contact: <a href="mailto:{{CONTACT_EMAIL}}">{{CONTACT_EMAIL}}</a></p>
</footer>
<!-- GP:JS -->
<script>
GP.init({ page: 'serve', wardName: {{WARD_NAME}}, webAppUrl: {{WEB_APP_URL}}, contact: {{CONTACT_EMAIL}}, fallback: {{FALLBACK}} });
GP.footer();
(function () {
  var el = GP.el;
  var main = GP.$('gp-main');

  function card(p) {
    var dates = p.firstDate === p.lastDate ? GP.fmtDate(p.firstDate) : GP.fmtDate(p.firstDate) + ' – ' + GP.fmtDate(p.lastDate);
    return el('a', { class: 'gp-card' + (p.full ? ' gp-full' : ''), href: GP.pageUrl('post', { p: p.publicId }) }, [
      p.categoryName ? el('p', { class: 'gp-cat' }, [p.categoryIcon ? el('span', { class: 'gp-cat-icon', 'aria-hidden': 'true' }, p.categoryIcon) : null, p.categoryName]) : null,
      el('h3', {}, p.title),
      // For a post shown under Everyone: whom it is for, in the fixed order.
      (p.audiences || []).length > 1 ? el('p', { class: 'gp-aud' }, GP.audienceLine(p)) : null,
      // ...and, when it is for Youth or Children, the parent line its own section would show.
      (p.audiences || []).length > 1 && (p.audiences.indexOf('Youth') >= 0 || p.audiences.indexOf('Children') >= 0)
        ? el('p', { class: 'gp-meta gp-parent' }, 'A parent signs up for their child')
        : null,
      el('p', { class: 'gp-meta' }, (p.organization ? p.organization + ' · ' : '') + dates),
      p.full ? el('p', { class: 'gp-filled' }, 'Filled ✓') : GP.fillBar(p.filled, p.needed),
      p.full ? null : el('p', { class: 'gp-count' }, p.filled + ' of ' + p.needed + ' filled'),
    ]);
  }

  /** One group's heading and cards, or null when it has none. */
  function section(groups, a, title) {
    if (!groups[a].length) return null;
    var young = a === 'Youth' || a === 'Children';
    return el('section', { class: 'gp-section' }, [
      el('h2', {}, title || a),
      young ? el('p', { class: 'gp-meta' }, 'A parent signs up for their child') : null,
    ].concat(groups[a].map(card)));
  }

  GP.call('serve').then(
    function (res) {
      if (!res || !res.ok) return GP.show(main, GP.message('alert', GP.errorText(res)));
      var groups = GP.groupByAudience(res.posts);
      var parts = [];
      // The Christmas giving card first (only when the ward ticked On Serve page for it).
      (res.offers || []).forEach(function (o) {
        parts.push(
          el('a', { class: 'gp-card gp-offer', href: o.url, target: '_blank', rel: 'noopener' }, [
            el('strong', {}, (o.icon ? o.icon + ' ' : '') + o.label),
          ])
        );
      });
      // Posts for more than one audience once, full width, under Everyone (decision 23); then
      // Brothers and Sisters side by side on wide screens (stacked on phones), then Youth and Children.
      var listed = 0;
      var everyone = section(groups, 'Everyone', (res.labels && res.labels.everyone) || 'Everyone');
      if (everyone) {
        listed++;
        parts.push(everyone);
      }
      var pair = [section(groups, 'Brothers'), section(groups, 'Sisters')].filter(Boolean);
      listed += pair.length;
      if (pair.length) parts.push(el('div', { class: pair.length === 2 ? 'gp-pair' : '' }, pair));
      ['Youth', 'Children'].forEach(function (a) {
        var sec = section(groups, a);
        if (sec) {
          listed++;
          parts.push(sec);
        }
      });
      if (!listed) parts.push(el('p', { class: 'gp-muted' }, 'Nothing to sign up for right now. Please check back soon.'));
      parts.push(
        el('p', { style: 'margin-top:1.5rem;text-align:center' }, [
          el('a', { class: 'gp-btn gp-light', href: GP.pageUrl('help') }, 'Request help or service'),
        ])
      );
      GP.show(main, parts);
    },
    function () {
      GP.show(main, GP.unreachable('serve'));
    }
  );
})();
</script>
</body>
</html>
