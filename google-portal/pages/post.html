<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<base target="_top">
<title>{{PAGE_TITLE}} · {{WARD_NAME}}</title>
<meta property="og:title" content="{{WARD_NAME}} · {{PAGE_TITLE}}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{PREVIEW_IMAGE}}">
<!-- GP:CSS -->
</head>
<body>
<main class="gp-wrap">
  <header class="gp-head">
    <p class="gp-ward">{{WARD_NAME}}</p>
    <h1 id="gp-title">{{PAGE_TITLE}}</h1>
  </header>
  <div id="gp-main"><p class="gp-loading">Loading…</p></div>
  <p class="gp-more"><a id="gp-back" class="gp-btn gp-light" href="serve.html">All service opportunities</a></p>
</main>
<footer class="gp-footer" id="gp-footer">
  <p>This page is an independent tool made by Church members. It is not an official product of, or sponsored by, The Church of Jesus Christ of Latter-day Saints.</p>
  <p class="gp-contact">Contact: <a href="mailto:{{CONTACT_EMAIL}}">{{CONTACT_EMAIL}}</a></p>
</footer>
<!-- GP:JS -->
<script>
GP.init({ page: 'post', wardName: {{WARD_NAME}}, webAppUrl: {{WEB_APP_URL}}, contact: {{CONTACT_EMAIL}}, fallback: {{FALLBACK}} });
GP.footer();
(function () {
  var el = GP.el;
  var main = GP.$('gp-main');
  GP.$('gp-back').setAttribute('href', GP.pageUrl('serve'));

  function isOpen(s) {
    return !s.full && !s.past;
  }

  /**
   * One full-width row per date and role: radio, weekday in gold, "Dec 2, 5:30 PM · Bring dinner",
   * then "N open" or "Filled". A filled (or past) row is greyed out and its radio disabled.
   */
  function slotRow(s, live, onPick) {
    var open = live && isOpen(s);
    var input = el('input', { type: 'radio', name: 'gp-slot', value: s.slotId, disabled: open ? null : 'disabled' });
    input.disabled = !open;
    var label = el('label', { class: 'gp-choice' + (open ? '' : ' gp-choice-off') }, []);
    input.addEventListener('change', function () {
      if (open) onPick(s, label);
    });
    var when = GP.fmtTimes(s.start, s.end);
    var wd = GP.weekday(s.date);
    var left = s.needed - s.filled;
    // Over the number is fine (a waiting sign-up approved later): say so plainly, "12 of 10".
    var right = s.full || left <= 0 ? 'Filled' + (s.filled > s.needed ? ' · ' + s.filled + ' of ' + s.needed : '') : s.past ? 'Over' : left + ' open';
    [
      input,
      el('span', { class: 'gp-choice-t' }, [
        wd ? el('span', { class: 'gp-w' }, wd) : null,
        (wd ? ', ' + GP.fmtDate(s.date).slice(5) : GP.fmtDate(s.date)) + (when ? ', ' + when : '') + ' · ' + s.role,
      ]),
      el('span', { class: 'gp-choice-open' }, right),
    ].forEach(function (c) {
      if (c) label.appendChild(c);
    });
    return [label, s.roleNote ? el('p', { class: 'gp-rolenote' }, s.roleNote) : null];
  }

  function rowsList(post, live, onPick) {
    var rows = [];
    post.slots.forEach(function (s) {
      slotRow(s, live, onPick).forEach(function (n) {
        if (n) rows.push(n);
      });
    });
    return el('fieldset', { class: 'gp-rows' }, [el('legend', {}, 'Pick a date and role')].concat(rows));
  }

  function signupForm(post) {
    var chosen = null;
    var chosenLabel = null;
    var out = el('div', { id: 'gp-out' });
    var bringWrap = el('div', { class: 'gp-hidden' });
    var bringLabel = el('label', { for: 'gp-bring' }, 'What are you bringing?');
    var bring = el('input', { type: 'text', id: 'gp-bring', maxlength: '200' });
    bringWrap.appendChild(bringLabel);
    bringWrap.appendChild(bring);
    var errs = {};
    function errBox(key) {
      errs[key] = el('p', { class: 'gp-error', role: 'alert' });
      return errs[key];
    }
    var list = rowsList(post, true, function (s, label) {
      chosen = s;
      if (chosenLabel) chosenLabel.className = 'gp-choice';
      chosenLabel = label;
      label.className = 'gp-choice gp-choice-on';
      bringLabel.textContent = s.bringingPrompt || 'What are you bringing?';
      bringWrap.className = s.bringingPrompt ? '' : 'gp-hidden';
    });
    if (!post.slots.filter(isOpen).length) {
      return el('div', { class: 'gp-signup' }, [el('h2', {}, 'Sign up'), list, el('p', { class: 'gp-filled' }, [GP.icon('check'), 'All filled. Thank you!'])]);
    }
    var name = el('input', { type: 'text', id: 'gp-name', autocomplete: 'name', maxlength: '80' });
    var email = el('input', { type: 'email', id: 'gp-email', autocomplete: 'email', maxlength: '254' });
    var button = el('button', { type: 'submit', class: 'gp-block' }, 'Sign up');
    // Youth and Children posts: a parent signs up themselves or a child (first name only).
    var young = post.audiences.indexOf('Youth') >= 0 || post.audiences.indexOf('Children') >= 0;
    var who = 'me';
    var nameLabel = el('label', { for: 'gp-name' }, 'Your name');
    var childWrap = young ? el('div', { class: 'gp-hidden' }) : null;
    var child = young ? el('input', { type: 'text', id: 'gp-child', maxlength: '40', autocomplete: 'off' }) : null;
    if (young) {
      childWrap.appendChild(el('label', { for: 'gp-child' }, "Your child's first name"));
      childWrap.appendChild(child);
    }
    function whoChoice(value, label) {
      var input = el('input', {
        type: 'radio',
        name: 'gp-who',
        value: value,
        checked: value === 'me',
        onchange: function () {
          who = value;
          childWrap.className = value === 'child' ? '' : 'gp-hidden';
          nameLabel.textContent = value === 'child' ? 'Your name (the parent)' : 'Your name';
        },
      });
      return el('label', { class: 'gp-choice' }, [input, label]);
    }
    var whoBox = young
      ? el('fieldset', {}, [
          el('legend', {}, 'Who is serving?'),
          el('div', { class: 'gp-seg2' }, [whoChoice('me', 'Me'), whoChoice('child', 'My child')]),
          el('p', { class: 'gp-meta' }, 'A parent signs up for their child. Use your own name and email; we never ask for a child\'s email. Sign up each child (and yourself) separately.'),
        ])
      : null;
    var form = el(
      'form',
      {
        class: 'gp-signup',
        onsubmit: function (e) {
          e.preventDefault();
          Object.keys(errs).forEach(function (k) {
            errs[k].textContent = '';
          });
          if (!chosen) {
            errs.slot.textContent = 'Pick a date and role.';
            return;
          }
          var childName = young && who === 'child' ? String(child.value || '').trim() : '';
          if (young && who === 'child' && !childName) {
            errs.childName.textContent = "Type your child's first name.";
            return;
          }
          button.disabled = true;
          GP.call('signup', { publicId: post.publicId, slotId: chosen.slotId, name: name.value, email: email.value, bringing: chosen.bringingPrompt ? bring.value : '', childName: childName }).then(
            function (res) {
              button.disabled = false;
              if (res && res.ok) {
                // Reload so the counts include this sign-up; the message replaces the form.
                return GP.call('post', { p: post.publicId }).then(
                  function (again) {
                    if (again && again.ok) render(again.post, res.message);
                    else GP.show(formWrap, GP.message('ok', res.message));
                  },
                  function () {
                    GP.show(formWrap, GP.message('ok', res.message));
                  }
                );
              }
              Object.keys((res && res.fields) || {}).forEach(function (k) {
                if (errs[k]) errs[k].textContent = res.fields[k];
              });
              GP.show(out, GP.message('alert', GP.errorText(res)));
            },
            function () {
              button.disabled = false;
              GP.show(out, GP.unreachable('post'));
            }
          );
        },
      },
      [
        el('h2', {}, 'Sign up'),
        list,
        errBox('slot'),
        whoBox,
        childWrap,
        errBox('childName'),
        nameLabel,
        name,
        errBox('name'),
        el('label', { for: 'gp-email' }, ['Your email ', el('span', { class: 'gp-meta' }, '(for your confirmation and reminder)')]),
        email,
        errBox('email'),
        bringWrap,
        errBox('bringing'),
        el('p', { style: 'margin-top:1rem' }, [button]),
        out,
      ]
    );
    var formWrap = el('div', {}, [form]);
    return formWrap;
  }

  function render(post, doneMessage) {
    GP.$('gp-title').textContent = post.title;
    document.title = post.title + ' · ' + GP.config().wardName;
    var parts = [
      el('div', { class: 'gp-card gp-intro' }, [
        el('p', { class: 'gp-meta' }, [post.organization, post.audiences.length ? ' · For ' + post.audiences.join(', ') : ''].join('')),
        post.publicNote ? el('p', { class: 'gp-note' }, post.publicNote) : null,
      ]),
    ];
    if (doneMessage) {
      parts.push(el('div', { class: 'gp-ok', role: 'status' }, [GP.icon('check'), el('div', {}, doneMessage)]));
    } else if (post.status === 'Open') {
      parts.push(signupForm(post));
    } else {
      parts.push(el('div', { class: 'gp-signup' }, [rowsList(post, false, function () {})]));
      if (post.status === 'Past') parts.push(el('p', { class: 'gp-muted' }, 'This opportunity is over. Thank you to everyone who served.'));
      else if (post.status === 'Cancelled') parts.push(el('p', { class: 'gp-muted' }, 'This opportunity was cancelled.'));
      else parts.push(el('p', { class: 'gp-muted' }, 'This opportunity is closed to new sign-ups.'));
    }
    GP.show(main, parts);
  }

  GP.hash().then(function (h) {
    if (!h.p) return GP.show(main, GP.message('alert', 'This link is missing part of its address. Open it again from the list.'));
    GP.call('post', { p: h.p }).then(
      function (res) {
        if (!res || !res.ok) return GP.show(main, GP.message('alert', GP.errorText(res)));
        render(res.post);
      },
      function () {
        GP.show(main, GP.unreachable('post'));
      }
    );
  });
})();
</script>
</body>
</html>
