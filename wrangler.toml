name = "wardforward"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Apps Script templates (templates/*.gs) are bundled as text and served at /templates/<name>
# (Start here step 6). Text module rule, so `import x from '../templates/x.gs'` is a string.
rules = [{ type = "Text", globs = ["**/*.gs"], fallthrough = true }]

# Non-secret config. Secrets (SESSION_SECRET, GOOGLE_CLIENT_ID/SECRET, ...) are set
# via `wrangler secret put` (prod) or `.dev.vars` (local). `.dev.vars` overrides these in dev.
[vars]
APP_URL = "https://app.wardforward.com"
OPERATOR_EMAILS = ""  # owner task: set to operator Google email(s), comma-separated
# Contact address under the "not an official Church product" disclaimer on every page and
# email (General Handbook 38.8.21.2). Empty hides the contact line; the owner sets it at deploy.
CONTACT_EMAIL = ""
# Cloudflare Turnstile site key for the public volunteer forms. This is Cloudflare's published
# always-pass TEST key; the owner replaces it with the app.wardforward.com widget's key at deploy.
# (The secret, TURNSTILE_SECRET_KEY, goes in .dev.vars / `wrangler secret put`.)
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

# --- Cron: hourly volunteer reminders, 48h nudges, lapsing, fill warnings, request purges
# (src/lib/volCron.ts); every minute, the bulk invitation pump (src/lib/invitations.ts) ---
[triggers]
crons = ["0 * * * *", "* * * * *"]

# --- Email: Cloudflare Email Service (src/lib/mail.ts is the only sender) ---
# Needs the Workers Paid plan and the sending domain onboarded (owner task:
# `wrangler email sending enable send.wardforward.com`). Under `wrangler dev` this binding is
# simulated (printed + saved to local files, never sent); EMAIL_DELIVERY=log in .dev.vars
# prints our own [dev email] block instead.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["no-reply@send.wardforward.com", "invite@send.wardforward.com"]

# --- D1 (structured data; source of truth) ---
# Local dev keys storage by database_name and ignores database_id. Owner replaces the
# placeholder id with the real one after: wrangler d1 create wardforward-db  (owner task O3).
[[d1_databases]]
binding = "DB"
database_name = "wardforward-db"
database_id = "00000000-0000-0000-0000-000000000000"

# --- R2 (uploaded files/images for deliverables) ---
# Local dev auto-creates local state. Owner runs once for prod:
#   wrangler r2 bucket create wardforward-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "wardforward-files"

# --- Production routes (uncomment at deploy, once the wardforward.com zone is on Cloudflare) ---
# Short links live on zippa.run (a separate project), so there is no shortener route here.
# [[routes]]
# pattern = "wardforward.com/*"
# zone_name = "wardforward.com"
# [[routes]]
# pattern = "app.wardforward.com/*"
# zone_name = "wardforward.com"
